name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issue?** Don't file it here: see SECURITY.md for private reporting."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a workspace owner
        2. Go to …
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Client form, Owner dashboard, Public page / widget, Super admin, Setup / deployment, Other]
  - type: input
    id: env
    attributes:
      label: Environment
      description: Commit or version, Node version, local Docker or Supabase Cloud, browser
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
